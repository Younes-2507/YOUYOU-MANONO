<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="js/login.js"></script>
    <title>Connexion</title>
    <link rel="stylesheet" href="loginstyle.css">
</head>
<body>

<div class="login-container">
    <form class="login-form">
        <h2>Connexion</h2>

        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Entrez votre email" required id="email">
        </div>

        <div class="input-group">
            <label>Mot de passe</label>
            <input type="password" placeholder="Entrez votre mot de passe" required id="mdp">
        </div>

        <button type="submit" id="login">Se connecter</button>

        <p class="register">
            Pas de compte ? <a href="signup.html">Inscrivez-vous</a>
        </p>
    </form>
</div>

</body>
</html>
