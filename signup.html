<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page d'inscription</title>
    <script type="module" src="js/register.js"></script>
    <link rel="stylesheet" href="signupstyle.css">
</head>
<body>

<div class="login-container">
    <form class="signup-form" id="signup-form">
        <h2>Inscription</h2>

        <div class="input-group">
            <label>Nom</label>
            <input type="text" placeholder="Entrez votre nom de famille" required id="last_name">
        </div>
        <div class="input-group">
            <label>Prenom</label>
            <input type="text" placeholder="Entrez votre prenom" required id="first_name">
        </div>
        <div class="input-group">
            <label>Date de naissance</label>
            <input type="date" placeholder="Entrez votre date de naissance" required id="birth_date">
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Entrez votre email" required id="email">
        </div>
        

        <div class="input-group">
            <label>Mot de passe</label>
            <input type="password" placeholder="Entrez votre mot de passe" required id="mdp">
        </div>

        
        <button type="submit" id="create_account">S'inscrire</button>
        <p class="register">
            Vous etes deja inscrits ? <a href="login.html">Connectez-vous</a>
        </p>

        <div class="error" id="error"></div>

    </form>
</div>

</body>
</html>
